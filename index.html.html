<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rose bouquet · ascii</title>
<style>
  html, body { margin: 0; height: 100%; background: #050607; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  button {
    position: fixed; right: 14px; bottom: 12px;
    background: none; border: 1px solid #2c3a33; color: #7fa08d;
    font: 12px ui-monospace, Menlo, Consolas, monospace;
    padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: #7fa08d; color: #c9f5d6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="replay">replay</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const BG = '#050607', FS = 15;
const PETAL = ['0', '1'];
const STEM_CH = ['|', '/', '\\'];
const LEAF_CH = ['~', '^', '`'];
const STEM0 = 0.6;            // seconds before stems start growing
const MSG = 'FOR YOU <3';

// Each rose: position (fraction of screen), size, shape phase, bloom start time (seconds)
const ROSES = [
  { fx: 0.50, fy: 0.37, fr: 0.22, ph: 0.3, t: 3.6 },
  { fx: 0.31, fy: 0.46, fr: 0.18, ph: 1.9, t: 4.6 },
  { fx: 0.69, fy: 0.46, fr: 0.18, ph: 4.1, t: 5.2 },
  { fx: 0.44, fy: 0.25, fr: 0.16, ph: 2.6, t: 6.0 },
  { fx: 0.58, fy: 0.26, fr: 0.14, ph: 0.8, t: 6.6 }
];

let W, H, dpr, cols, rows, CW, CH;
let cells = [], petals = [], stars = [], parts = [];
let t0 = 0, lastT = 0;

const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = FS + 'px ui-monospace, Menlo, Consolas, monospace';
  CW = ctx.measureText('M').width;
  CH = FS * 1.15;
  cols = Math.floor(W / CW);
  rows = Math.floor(H / CH);
}

function build() {
  const K = CH / CW;                       // cell aspect correction
  const map = new Map();
  const put = (c, r, o) => {
    if (c < 0 || r < 0 || c >= cols || r >= rows) return;
    const k = r * cols + c, old = map.get(k);
    if (!old || o.prio > old.prio) map.set(k, { ...o, c, r });
  };

  const bx = cols * 0.5, by = rows * 0.93;   // bouquet base

  ROSES.forEach((R0, i) => {
    const cx = R0.fx * cols, cy = R0.fy * rows;
    const R = R0.fr * Math.min(cols, rows * K);
    const tx = cx, ty = cy + (R / K) * 0.9;

    // stem: quadratic curve from base up to the rose
    const qx = bx + (tx - bx) * 0.3 + Math.sin(R0.ph) * cols * 0.05;
    const qy = (by + ty) / 2;
    const pts = [];
    for (let s = 0; s <= 1.0001; s += 0.004) {
      pts.push({
        s,
        x: (1 - s) * (1 - s) * bx + 2 * (1 - s) * s * qx + s * s * tx,
        y: (1 - s) * (1 - s) * by + 2 * (1 - s) * s * qy + s * s * ty
      });
    }
    pts.forEach((p, j) => {
      const n = pts[Math.min(j + 1, pts.length - 1)];
      const nx = n.x - p.x, ny = n.y - p.y;
      const ch = Math.abs(ny) > Math.abs(nx) * 2 ? '|' : (nx * ny < 0 ? '/' : '\\');
      put(Math.round(p.x), Math.round(p.y), {
        prio: 1, rev: STEM0 + i * 0.5 + p.s * 2.4, ch, col: '#3fbf6a'
      });
    });

    // leaves sprout partway up each stem
    [0.35, 0.6].forEach((f, k) => {
      const p = pts[Math.round(f * (pts.length - 1))];
      const side = k % 2 ? 1 : -1;
      for (let j = 1; j <= 3; j++) {
        put(Math.round(p.x + side * j), Math.round(p.y - j * 0.3), {
          prio: 2, rev: STEM0 + i * 0.5 + p.s * 2.4 + 0.15,
          ch: pick(LEAF_CH), col: '#2e9e55'
        });
      }
    });

    // rose head: petals are layered rings that bloom from the centre outward
    for (let r = Math.floor(cy - R / K - 2); r <= Math.ceil(cy + R / K + 2); r++) {
      for (let c = Math.floor(cx - R - 2); c <= Math.ceil(cx + R + 2); c++) {
        const dx = c - cx, dy = (r - cy) * K;
        const dist = Math.hypot(dx, dy);
        const a = Math.atan2(dy, dx);
        const m = 0.92 + 0.13 * Math.cos(5 * a + R0.ph) + 0.05 * Math.cos(11 * a + R0.ph * 2);
        const q = dist / R / m;
        if (q > 1) continue;
        const h = hash(c + i * 97, r);
        let ch = h > 0.5 ? '1' : '0';
        if (h > 0.78) ch = pick(PETAL);
        const col = q < 0.3 ? '#ffb3c7' : q < 0.62 ? '#ff4d6a' : '#c81e36';
        put(c, r, { prio: 3, rev: R0.t + q * 2.4 + h * 0.45, ch, col });
      }
    }
  });

  cells = [...map.values()];
  petals = cells.filter(o => o.prio === 3);

  stars = Array.from({ length: Math.floor(cols * rows * 0.012) }, () => ({
    c: Math.floor(Math.random() * cols),
    r: Math.floor(Math.random() * rows),
    ch: pick(['.', '+', '*', '✦']),
    sp: 0.5 + Math.random() * 1.5,
    ph: Math.random() * 6
  }));
}

function frame(now) {
  const t = (now - t0) / 1000;
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  ctx.font = FS + 'px ui-monospace, Menlo, Consolas, monospace';

  // twinkling background
  for (const s of stars) {
    const a = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
    ctx.fillStyle = `rgba(150,200,170,${0.08 + 0.22 * a})`;
    ctx.fillText(s.ch, s.c * CW, s.r * CH);
  }

  // soft red glow behind the bouquet, fades in as it blooms
  const glow = ctx.createRadialGradient(W / 2, H * 0.4, 10, W / 2, H * 0.4, Math.max(W, H) * 0.45);
  glow.addColorStop(0, 'rgba(255,60,90,' + (0.2 * Math.min(1, t / 6)) + ')');
  glow.addColorStop(1, 'rgba(255,60,90,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // stems, leaves and petals reveal over time
  for (const o of cells) {
    if (t < o.rev - 0.3) continue;
    if (t < o.rev) {
      // brief flicker before a cell is "written"
      ctx.fillStyle = 'rgba(160,255,190,0.45)';
      ctx.fillText(pick(PETAL), o.c * CW, o.r * CH);
    } else {
      ctx.fillStyle = o.col;
      ctx.fillText(o.ch, o.c * CW, o.r * CH);
    }
  }

  // petals start falling after the bloom
  if (t > 12 && petals.length && Math.random() < dt * 8) {
    const p = pick(petals);
    if (p.rev < t) parts.push({ x: p.c, y: p.r, vy: 0.8 + Math.random() * 0.6, ph: Math.random() * 6, ch: pick(['0', '1']) });
  }
  for (const p of parts) {
    p.y += p.vy * dt;
    p.x += Math.sin(t * 1.3 + p.ph) * 0.9 * dt;
    ctx.fillStyle = 'rgba(255,140,170,0.8)';
    ctx.fillText(p.ch, p.x * CW, p.y * CH);
  }
  parts = parts.filter(p => p.y < rows);

  // caption types in at the end
  const n = Math.floor(Math.max(0, (t - 14) / 0.2));
  if (n > 0) {
    ctx.font = 'bold ' + (FS * 2.2) + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.shadowColor = '#ff2e63';
    ctx.shadowBlur = 18;
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(t * 3);
    ctx.fillStyle = '#ffd1dc';
    const x0 = (W - ctx.measureText(MSG).width) / 2;
    ctx.fillText(MSG.slice(0, Math.min(n, MSG.length)), x0, H / 2 - FS);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}

function start() {
  t0 = performance.now();
  lastT = t0;
  parts = [];
}

resize();
build();
start();
requestAnimationFrame(frame);

window.addEventListener('resize', () => { resize(); build(); });
document.getElementById('replay').onclick = start;
</script>
</body>
</html>
